<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATSMATRIX // SWARM — High-Performance Multi-Agent Engine</title>
<style>
  :root {
    --bg: #05070c;
    --panel: rgba(10, 14, 22, 0.78);
    --border: rgba(100, 180, 255, 0.16);
    --text: #d4e2f5;
    --dim: #6b7a94;
    --accent: #00e5ff;
    --accent-2: #a78bfa;
    --ok: #34d399;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--mono); -webkit-font-smoothing: antialiased;
  }
  #view { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 18px; left: 18px; width: 310px;
    padding: 16px 18px 14px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(12px); user-select: none;
    box-shadow: 0 10px 40px rgba(0,0,0,0.55);
  }
  .hud-title {
    font-size: 14px; font-weight: 700; letter-spacing: 0.16em; margin-bottom: 14px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hud-title .dim { font-weight: 400; letter-spacing: 0.04em; opacity: 0.7; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 16px; }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .label { font-size: 9px; letter-spacing: 0.14em; color: var(--dim); }
  .value { font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .value.ok { color: var(--ok); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .ctl {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em;
    color: var(--text); background: rgba(255,255,255,0.05);
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 11px;
    cursor: pointer; transition: all 0.15s ease;
  }
  .ctl:hover { border-color: var(--accent); color: var(--accent); }
  .ctl.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(0,229,255,0.1); box-shadow: 0 0 14px rgba(0,229,255,0.2);
  }
  .hint { margin-top: 14px; font-size: 9px; line-height: 1.65; letter-spacing: 0.04em; color: var(--dim); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<header id="hud">
  <div class="hud-title">ATSMATRIX <span class="dim">// SWARM</span></div>
  <div class="stats">
    <div class="stat"><span class="label">FPS</span><span id="fps" class="value">—</span></div>
    <div class="stat"><span class="label">AGENTS</span><span id="count" class="value">—</span></div>
    <div class="stat"><span class="label">STATUS</span><span id="status" class="value ok">RUNNING</span></div>
    <div class="stat"><span class="label">MODE</span><span id="mode" class="value">REPEL</span></div>
  </div>
  <div class="controls">
    <button class="ctl" data-count="500">500</button>
    <button class="ctl active" data-count="1000">1000</button>
    <button class="ctl" data-count="1500">1500</button>
    <span class="sep"></span>
    <button id="btn-pause" class="ctl">PAUSE</button>
    <button id="btn-mode" class="ctl">REPEL</button>
    <button id="btn-trails" class="ctl active">TRAILS</button>
  </div>
  <div class="hint">SPACE pause · M mode · T trails · R reset · 1/2/3 count<br>Pointer creates force field · High-FPS Canvas engine</div>
</header>

<script>
"use strict";
/* ATSMATRIX // SWARM — High-performance multi-agent flocking engine
   Optimized SoA + spatial grid. Zero per-frame allocations in hot path. */

const CONFIG = {
  DEFAULT_COUNT: 1000,
  MAX_AGENTS: 2000,
  PERCEPTION: 52,
  MAX_NEIGHBORS: 14,
  MAX_SPEED: 195,
  MIN_SPEED: 48,
  MAX_FORCE: 480,
  W_SEPARATION: 1.75,
  W_ALIGNMENT: 1.05,
  W_COHESION: 0.82,
  NOISE: 28,
  MOUSE_RADIUS: 165,
  MOUSE_FORCE: 1100,
  TRAIL_ALPHA: 0.22,
  PALETTE_SIZE: 80,
  DPR_CAP: 1.5,
};

class SpatialGrid {
  constructor(cellSize, maxAgents) {
    this.cellSize = cellSize;
    this.maxAgents = maxAgents;
    this.next = new Int32Array(maxAgents);
    this.cols = 1; this.rows = 1;
    this.cellHead = new Int32Array(1);
  }
  resize(width, height) {
    const cs = this.cellSize;
    this.cols = Math.max(1, Math.ceil(width / cs));
    this.rows = Math.max(1, Math.ceil(height / cs));
    const n = this.cols * this.rows;
    if (this.cellHead.length !== n) this.cellHead = new Int32Array(n);
  }
  rebuild(n, px, py) {
    const { cols, rows, cellSize, cellHead, next } = this;
    cellHead.fill(-1);
    const inv = 1 / cellSize;
    for (let i = 0; i < n; i++) {
      let cx = (px[i] * inv) | 0, cy = (py[i] * inv) | 0;
      if (cx < 0) cx = 0; else if (cx >= cols) cx = cols - 1;
      if (cy < 0) cy = 0; else if (cy >= rows) cy = rows - 1;
      const c = cy * cols + cx;
      next[i] = cellHead[c];
      cellHead[c] = i;
    }
  }
}

class FlockingSystem {
  constructor(cfg) {
    this.cfg = cfg;
    this.n = 0;
    this.width = 800; this.height = 600;
    const max = cfg.MAX_AGENTS;
    this.px = new Float32Array(max);
    this.py = new Float32Array(max);
    this.vx = new Float32Array(max);
    this.vy = new Float32Array(max);
    this.grid = new SpatialGrid(cfg.PERCEPTION, max);
  }
  setCount(n) {
    n = Math.min(n, this.cfg.MAX_AGENTS);
    for (let i = this.n; i < n; i++) this.seed(i);
    this.n = n;
  }
  reset(n) { this.n = 0; this.setCount(n); }
  seed(i) {
    const w = this.width, h = this.height;
    this.px[i] = Math.random() * w;
    this.py[i] = Math.random() * h;
    const a = Math.random() * Math.PI * 2;
    const s = this.cfg.MIN_SPEED + Math.random() * (this.cfg.MAX_SPEED - this.cfg.MIN_SPEED);
    this.vx[i] = Math.cos(a) * s;
    this.vy[i] = Math.sin(a) * s;
  }
  resize(w, h) {
    this.width = w; this.height = h;
    this.grid.resize(w, h);
  }
  update(dt, mouse) {
    const { n, px, py, vx, vy, cfg, grid } = this;
    if (n === 0) return;

    grid.rebuild(n, px, py);

    const perc2 = cfg.PERCEPTION * cfg.PERCEPTION;
    const maxSpeed = cfg.MAX_SPEED;
    const maxForce = cfg.MAX_FORCE;
    const wSep = cfg.W_SEPARATION, wAli = cfg.W_ALIGNMENT, wCoh = cfg.W_COHESION;
    const maxN = cfg.MAX_NEIGHBORS;
    const noise = cfg.NOISE;
    const mR2 = cfg.MOUSE_RADIUS * cfg.MOUSE_RADIUS;
    const mForce = (mouse.attract ? 1 : -1) * cfg.MOUSE_FORCE;
    const minSpeed = cfg.MIN_SPEED;

    const { cols, rows, cellHead, next } = grid;
    const w = this.width, h = this.height;

    for (let i = 0; i < n; i++) {
      const x = px[i], y = py[i];
      const cx = Math.min(cols - 1, Math.max(0, (x / grid.cellSize) | 0));
      const cy = Math.min(rows - 1, Math.max(0, (y / grid.cellSize) | 0));

      let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, count = 0;

      const x0 = cx > 0 ? cx - 1 : 0, x1 = cx < cols - 1 ? cx + 1 : cols - 1;
      const y0 = cy > 0 ? cy - 1 : 0, y1 = cy < rows - 1 ? cy + 1 : rows - 1;
      outer:
      for (let gy = y0; gy <= y1; gy++) {
        for (let gx = x0; gx <= x1; gx++) {
          for (let j = cellHead[gy * cols + gx]; j !== -1; j = next[j]) {
            if (j === i) continue;
            const dx = px[j] - x, dy = py[j] - y;
            const d2 = dx * dx + dy * dy;
            if (d2 > perc2 || d2 < 1e-6) continue;
            const inv = 1 / Math.sqrt(d2);
            sepX -= dx * inv * inv;
            sepY -= dy * inv * inv;
            aliX += vx[j]; aliY += vy[j];
            cohX += dx; cohY += dy;
            if (++count >= maxN) break outer;
          }
        }
      }

      let fx = 0, fy = 0;
      if (count > 0) {
        // Separation
        let m = Math.sqrt(sepX * sepX + sepY * sepY);
        if (m > 1e-6) {
          let dx = sepX / m * maxSpeed - vx[i];
          let dy = sepY / m * maxSpeed - vy[i];
          let s = Math.sqrt(dx * dx + dy * dy);
          if (s > maxForce) { s = maxForce / s; } else s = 1;
          fx += dx * s * wSep; fy += dy * s * wSep;
        }
        // Alignment
        let dx = aliX / count, dy = aliY / count;
        m = Math.sqrt(dx * dx + dy * dy);
        if (m > 1e-6) {
          dx = dx / m * maxSpeed - vx[i]; dy = dy / m * maxSpeed - vy[i];
          let s = Math.sqrt(dx * dx + dy * dy);
          if (s > maxForce) { s = maxForce / s; } else s = 1;
          fx += dx * s * wAli; fy += dy * s * wAli;
        }
        // Cohesion
        dx = cohX / count; dy = cohY / count;
        m = Math.sqrt(dx * dx + dy * dy);
        if (m > 1e-6) {
          dx = dx / m * maxSpeed - vx[i]; dy = dy / m * maxSpeed - vy[i];
          let s = Math.sqrt(dx * dx + dy * dy);
          if (s > maxForce) { s = maxForce / s; } else s = 1;
          fx += dx * s * wCoh; fy += dy * s * wCoh;
        }
      }

      // Pointer force field
      if (mouse.active) {
        const dx = mouse.x - x, dy = mouse.y - y;
        const d2 = dx * dx + dy * dy;
        if (d2 < mR2 && d2 > 1e-4) {
          const d = Math.sqrt(d2);
          const f = mForce * (1 - d / cfg.MOUSE_RADIUS) / d;
          fx += dx * f; fy += dy * f;
        }
      }

      // Organic jitter
      fx += (Math.random() - 0.5) * noise;
      fy += (Math.random() - 0.5) * noise;

      // Integrate + clamp speed
      let nvx = vx[i] + fx * dt;
      let nvy = vy[i] + fy * dt;
      const sp2 = nvx * nvx + nvy * nvy;
      if (sp2 > maxSpeed * maxSpeed) {
        const k = maxSpeed / Math.sqrt(sp2); nvx *= k; nvy *= k;
      } else if (sp2 > 1e-6 && sp2 < minSpeed * minSpeed) {
        const k = minSpeed / Math.sqrt(sp2); nvx *= k; nvy *= k;
      }
      vx[i] = nvx; vy[i] = nvy;

      let nx = x + nvx * dt, ny = y + nvy * dt;
      if (nx < 0) nx += w; else if (nx >= w) nx -= w;
      if (ny < 0) ny += h; else if (ny >= h) ny -= h;
      px[i] = nx; py[i] = ny;
    }
  }
}

class Renderer {
  constructor(canvas, cfg) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.cfg = cfg;
    this.trails = true;
    this.palette = this.buildPalette();
    this.resize();
  }
  buildPalette() {
    const out = [];
    const n = this.cfg.PALETTE_SIZE;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const hue = 185 + t * 85;
      const light = 55 + t * 12;
      out.push(`hsl(${hue.toFixed(0)}, 92%, ${light.toFixed(0)}%)`);
    }
    return out;
  }
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, this.cfg.DPR_CAP);
    const w = window.innerWidth, h = window.innerHeight;
    this.canvas.width = (w * dpr) | 0;
    this.canvas.height = (h * dpr) | 0;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = w; this.h = h;
    this.paintBackground(1);
  }
  paintBackground(alpha) {
    const ctx = this.ctx;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#05070c';
    ctx.fillRect(0, 0, this.w, this.h);
    ctx.globalAlpha = 1;
  }
  render(system, mouse) {
    const { ctx, w, h } = this;
    if (this.trails) this.paintBackground(this.cfg.TRAIL_ALPHA);
    else this.paintBackground(1);

    if (mouse.active) {
      const r = this.cfg.MOUSE_RADIUS;
      const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, r);
      const c = mouse.attract ? '167,139,250' : '0,229,255';
      g.addColorStop(0, `rgba(${c}, 0.12)`);
      g.addColorStop(1, `rgba(${c}, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r, 0, 6.2832);
      ctx.fill();
    }

    const n = system.n;
    const px = system.px, py = system.py, vx = system.vx, vy = system.vy;
    const pal = this.palette, palN = pal.length;
    const minS = this.cfg.MIN_SPEED, span = this.cfg.MAX_SPEED - minS;
    const s = 6.2, sB = s * 0.58, hw = s * 0.52;

    for (let i = 0; i < n; i++) {
      const x = px[i], y = py[i];
      const inv = 1 / Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i] + 1e-6);
      const c = vx[i] * inv, sn = vy[i] * inv;

      let t = (Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]) - minS) / span;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      ctx.fillStyle = pal[(t * (palN - 1)) | 0];

      ctx.beginPath();
      ctx.moveTo(x + c * s, y + sn * s);
      ctx.lineTo(x - c * sB - sn * hw, y - sn * sB + c * hw);
      ctx.lineTo(x - c * sB + sn * hw, y - sn * sB - c * hw);
      ctx.closePath();
      ctx.fill();
    }
  }
}

class HUD {
  constructor(system) {
    this.system = system;
    this.fpsEl = document.getElementById('fps');
    this.countEl = document.getElementById('count');
    this.statusEl = document.getElementById('status');
    this.modeEl = document.getElementById('mode');
    this.fps = 60;
    this.acc = 0;
    this.countDirty = true;
  }
  tick(dt) {
    if (dt > 0) this.fps += (1 / dt - this.fps) * 0.1;
    this.acc += dt;
    if (this.acc < 0.2) return;
    this.acc = 0;
    this.fpsEl.textContent = Math.round(this.fps);
    if (this.countDirty) {
      this.countEl.textContent = this.system.n;
      this.countDirty = false;
    }
  }
  setAgents() { this.countDirty = true; }
  setStatus(running) {
    this.statusEl.textContent = running ? 'RUNNING' : 'PAUSED';
    this.statusEl.classList.toggle('ok', running);
  }
  setMode(attract) { this.modeEl.textContent = attract ? 'ATTRACT' : 'REPEL'; }
}

const canvas = document.getElementById('view');
const system = new FlockingSystem(CONFIG);
const renderer = new Renderer(canvas, CONFIG);
const hud = new HUD(system);

const mouse = { x: 0, y: 0, active: false, attract: false };
let paused = false;

function syncSize() {
  renderer.resize();
  system.resize(renderer.w, renderer.h);
  renderer.paintBackground(1);
}
syncSize();
system.setCount(CONFIG.DEFAULT_COUNT);
window.addEventListener('resize', syncSize);

window.addEventListener('pointermove', (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#hud')) return;
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
document.addEventListener('mouseleave', () => { mouse.active = false; });

const countButtons = [...document.querySelectorAll('[data-count]')];
function setCount(n) {
  system.setCount(n);
  hud.setAgents();
  countButtons.forEach((b) => b.classList.toggle('active', +b.dataset.count === n));
}
countButtons.forEach((b) => b.addEventListener('click', () => setCount(+b.dataset.count)));

const btnPause = document.getElementById('btn-pause');
const btnMode = document.getElementById('btn-mode');
const btnTrails = document.getElementById('btn-trails');

function togglePause() {
  paused = !paused;
  btnPause.textContent = paused ? 'RESUME' : 'PAUSE';
  btnPause.classList.toggle('active', paused);
  hud.setStatus(!paused);
}
function toggleMode() {
  mouse.attract = !mouse.attract;
  btnMode.textContent = mouse.attract ? 'ATTRACT' : 'REPEL';
  btnMode.classList.toggle('active', mouse.attract);
  hud.setMode(mouse.attract);
}
function toggleTrails() {
  renderer.trails = !renderer.trails;
  btnTrails.classList.toggle('active', renderer.trails);
}

btnPause.addEventListener('click', togglePause);
btnMode.addEventListener('click', toggleMode);
btnTrails.addEventListener('click', toggleTrails);

window.addEventListener('keydown', (e) => {
  switch (e.key) {
    case ' ': e.preventDefault(); togglePause(); break;
    case 'm': case 'M': toggleMode(); break;
    case 't': case 'T': toggleTrails(); break;
    case 'r': case 'R': system.reset(CONFIG.DEFAULT_COUNT); setCount(CONFIG.DEFAULT_COUNT); break;
    case '1': setCount(500); break;
    case '2': setCount(1000); break;
    case '3': setCount(1500); break;
  }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (!paused) system.update(dt, mouse);
  renderer.render(system, mouse);
  hud.tick(paused ? 0 : dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
