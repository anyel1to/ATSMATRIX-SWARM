<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATSMATRIX // SWARM — Multi-Agent Flocking Engine</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <!-- Minimal HUD -->
  <header id="hud">
    <div class="hud-title">ATSMATRIX <span class="dim">// SWARM</span></div>

    <div class="stats">
      <div class="stat"><span class="label">FPS</span><span id="fps" class="value">—</span></div>
      <div class="stat"><span class="label">AGENTS</span><span id="count" class="value">—</span></div>
      <div class="stat"><span class="label">STATUS</span><span id="status" class="value ok">RUNNING</span></div>
      <div class="stat"><span class="label">POINTER</span><span id="mode" class="value">REPEL</span></div>
    </div>

    <div class="controls">
      <button class="ctl" data-count="300">300</button>
      <button class="ctl active" data-count="500">500</button>
      <button class="ctl" data-count="800">800</button>
      <span class="sep"></span>
      <button id="btn-pause" class="ctl">PAUSE</button>
      <button id="btn-mode" class="ctl">REPEL</button>
      <button id="btn-trails" class="ctl active">TRAILS</button>
    </div>

    <div class="hint">SPACE pause · M mode · T trails · R reset · 1/2/3 count · pointer = force field</div>
  </header>

  <script type="module" src="js/main.js"></script>
</body>
</html>
